name: saldo360

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - saldo360-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: saldo360-api:${SALDO360_IMAGE_TAG:-local}
    restart: unless-stopped
    group_add:
      - "1654"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Saldo360: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Authentication__Oidc__Authority: https://auth.home.doublesilva.com
      Authentication__Oidc__ClientId: saldo360
      Authentication__Oidc__ClientSecretFile: /run/secrets/oidc-client-secret
      Authentication__Oidc__BackchannelCaCertificatePath: /usr/local/share/ca-certificates/caddy-local-root.crt
      FinancialEmailImport__Gmail__ClientIdFile: /etc/saldo360/secrets/gmail/client-id
      FinancialEmailImport__Gmail__ClientSecretFile: /etc/saldo360/secrets/gmail/client-secret
      FinancialEmailImport__Gmail__RefreshTokenFile: /etc/saldo360/secrets/gmail/refresh-token
      FinancialEmailImport__Enabled: "false"
      FinancialEmailImport__Provider: Gmail
      FinancialEmailImport__TimeZone: America/Sao_Paulo
      FinancialEmailImport__Gmail__Mailbox: silva.pucrs@gmail.com

      FinancialEmailImport__Sources__0__Name: ItauCards
      FinancialEmailImport__Sources__0__FamilyId: 01a14a7d-0614-73f5-911c-ec59a507c436
      FinancialEmailImport__Sources__0__Query: 'has:attachment subject:"fatura do seu cartão" -subject:"Nu Empresas"'
      FinancialEmailImport__Sources__0__Enabled: "true"
      FinancialEmailImport__Sources__0__CollectionMode: Attachments

      FinancialEmailImport__Sources__1__Name: NuEmpresas
      FinancialEmailImport__Sources__1__FamilyId: 01a14a7d-0614-73f5-911c-ec59a507c436
      FinancialEmailImport__Sources__1__Query: 'has:attachment subject:"fatura do seu cartão Nu Empresas"'
      FinancialEmailImport__Sources__1__Enabled: "true"
      FinancialEmailImport__Sources__1__CollectionMode: Attachments

      FinancialEmailImport__Sources__2__Name: ZaffariBourbon
      FinancialEmailImport__Sources__2__FamilyId: 01a14a7d-0614-73f5-911c-ec59a507c436
      FinancialEmailImport__Sources__2__Query: 'Fatura Bourbon has:attachment'
      FinancialEmailImport__Sources__2__Enabled: "true"
      FinancialEmailImport__Sources__2__CollectionMode: Attachments

      FinancialEmailImport__Sources__3__Name: Ceee
      FinancialEmailImport__Sources__3__FamilyId: 01a14a7d-0614-73f5-911c-ec59a507c436
      FinancialEmailImport__Sources__3__Query: 'has:attachment subject:"fatura ceee" -subject:"738.283.010-94"'
      FinancialEmailImport__Sources__3__Enabled: "true"
      FinancialEmailImport__Sources__3__CollectionMode: Attachments

      FinancialEmailImport__Sources__4__Name: Dmae
      FinancialEmailImport__Sources__4__FamilyId: 01a14a7d-0614-73f5-911c-ec59a507c436
      FinancialEmailImport__Sources__4__Query: 'dmae conta'
      FinancialEmailImport__Sources__4__Enabled: "true"
      FinancialEmailImport__Sources__4__CollectionMode: Links
      FinancialEmailImport__Sources__4__AllowedLinkHosts__0: dmaeagvrt.procempa.com.br
      FinancialEmailImport__Sources__4__AllowedLinkPathPrefixes__0: /gsan/

      FinancialDocuments__StoragePath: /var/lib/saldo360/financial-documents
      ReverseProxy__KnownNetworks__0: 172.16.0.0/12
      ReverseProxy__AllowedHosts__0: ${SALDO360_PUBLIC_HOST:?Defina SALDO360_PUBLIC_HOST no .env}
    volumes:
      - /etc/saldo360/secrets/oidc-client-secret:/run/secrets/oidc-client-secret:ro
      - /etc/saldo360/secrets/gmail:/etc/saldo360/secrets/gmail:ro
      - /etc/homeautomation/certs/caddy-local-root.crt:/usr/local/share/ca-certificates/caddy-local-root.crt:ro
      - /var/lib/saldo360/financial-documents:/var/lib/saldo360/financial-documents:rw
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: saldo360-web:${SALDO360_IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SALDO360_WEB_PORT:-5600}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

  migrate:
    image: saldo360-api:${SALDO360_IMAGE_TAG:-local}
    profiles: ["migration"]
    entrypoint: ["/app/efbundle"]
    group_add:
      - "1654"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Saldo360: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Authentication__Oidc__Authority: https://auth.home.doublesilva.com
      Authentication__Oidc__ClientId: saldo360
      Authentication__Oidc__ClientSecretFile: /run/secrets/oidc-client-secret
      Authentication__Oidc__BackchannelCaCertificatePath: /usr/local/share/ca-certificates/caddy-local-root.crt
    volumes:
      - /etc/saldo360/secrets/oidc-client-secret:/run/secrets/oidc-client-secret:ro
      - /etc/homeautomation/certs/caddy-local-root.crt:/usr/local/share/ca-certificates/caddy-local-root.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

volumes:
  saldo360-pgdata:

networks:
  backend: {}
