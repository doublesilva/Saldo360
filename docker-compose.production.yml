name: saldo360

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - saldo360-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: saldo360-api:${SALDO360_IMAGE_TAG:?Defina SALDO360_IMAGE_TAG com o SHA imutavel do release}
    restart: unless-stopped
    group_add:
      - "1654"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Saldo360: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Authentication__Oidc__Authority: https://auth.home.doublesilva.com
      Authentication__Oidc__ClientId: saldo360
      Authentication__Oidc__ClientSecretFile: /run/secrets/oidc-client-secret
      ServiceAccounts__IdentifierHmacKeyFile: /run/secrets/service-account-identifier-hmac-key
      Authentication__Oidc__BackchannelCaCertificatePath: /usr/local/share/ca-certificates/caddy-local-root.crt
      FinancialEmailImport__Gmail__ClientIdFile: /etc/saldo360/secrets/gmail/client-id
      FinancialEmailImport__Gmail__ClientSecretFile: /etc/saldo360/secrets/gmail/client-secret
      FinancialEmailImport__Gmail__RefreshTokenFile: /etc/saldo360/secrets/gmail/refresh-token
      FinancialEmailImport__Enabled: "false"
      FinancialEmailImport__Provider: Gmail
      FinancialEmailImport__TimeZone: America/Sao_Paulo
      FinancialEmailImport__Gmail__Mailbox: silva.pucrs@gmail.com
      FinancialDocumentClassification__Enabled: ${FINANCIAL_DOCUMENT_CLASSIFICATION_ENABLED:-false}
      FinancialDocumentClassification__AgentEnabled: ${FINANCIAL_DOCUMENT_CLASSIFICATION_AGENT_ENABLED:-false}
      ServiceBillExtraction__Enabled: ${SERVICE_BILL_EXTRACTION_ENABLED:-false}
      ServiceBillExtraction__AgentEnabled: ${SERVICE_BILL_EXTRACTION_AGENT_ENABLED:-false}
      ServiceBillReconciliation__Enabled: ${SERVICE_BILL_RECONCILIATION_ENABLED:-false}
      ServiceBillReconciliation__ConfirmationEnabled: ${SERVICE_BILL_CONFIRMATION_ENABLED:-false}
      ServiceBillReconciliation__BindingEnabled: ${SERVICE_BILL_BINDING_ENABLED:-false}

      FinancialEmailImport__Sources__0__Name: ItauCards
      FinancialEmailImport__Sources__0__WorkspaceId: ${FINANCIAL_WORKSPACE_ID:?Define the approved production workspace ID before cutover}
      FinancialEmailImport__Sources__0__Query: 'has:attachment subject:"fatura do seu cartão" -subject:"Nu Empresas"'
      FinancialEmailImport__Sources__0__Enabled: "true"
      FinancialEmailImport__Sources__0__CollectionMode: Attachments

      FinancialEmailImport__Sources__1__Name: NuEmpresas
      FinancialEmailImport__Sources__1__WorkspaceId: ${FINANCIAL_WORKSPACE_ID:?Define the approved production workspace ID before cutover}
      FinancialEmailImport__Sources__1__Query: 'has:attachment subject:"fatura do seu cartão Nu Empresas"'
      FinancialEmailImport__Sources__1__Enabled: "true"
      FinancialEmailImport__Sources__1__CollectionMode: Attachments

      FinancialEmailImport__Sources__2__Name: ZaffariBourbon
      FinancialEmailImport__Sources__2__WorkspaceId: ${FINANCIAL_WORKSPACE_ID:?Define the approved production workspace ID before cutover}
      FinancialEmailImport__Sources__2__Query: 'Fatura Bourbon has:attachment'
      FinancialEmailImport__Sources__2__Enabled: "true"
      FinancialEmailImport__Sources__2__CollectionMode: Attachments

      FinancialEmailImport__Sources__3__Name: Ceee
      FinancialEmailImport__Sources__3__WorkspaceId: ${FINANCIAL_WORKSPACE_ID:?Define the approved production workspace ID before cutover}
      FinancialEmailImport__Sources__3__Query: 'has:attachment subject:"fatura ceee" -subject:"738.283.010-94"'
      FinancialEmailImport__Sources__3__Enabled: "true"
      FinancialEmailImport__Sources__3__CollectionMode: Attachments

      FinancialEmailImport__Sources__4__Name: Dmae
      FinancialEmailImport__Sources__4__WorkspaceId: ${FINANCIAL_WORKSPACE_ID:?Define the approved production workspace ID before cutover}
      FinancialEmailImport__Sources__4__Query: 'dmae conta'
      FinancialEmailImport__Sources__4__Enabled: "true"
      FinancialEmailImport__Sources__4__CollectionMode: Links
      FinancialEmailImport__Sources__4__AllowedLinkHosts__0: dmaeagvrt.procempa.com.br
      FinancialEmailImport__Sources__4__AllowedLinkPathPrefixes__0: /gsan/

      FinancialEmailImport__Sources__5__Name: Vivo
      FinancialEmailImport__Sources__5__WorkspaceId: ${FINANCIAL_WORKSPACE_ID:?Define the approved production workspace ID before cutover}
      FinancialEmailImport__Sources__5__Query: 'has:attachment (subject:"sua conta vivo" OR subject:"fatura vivo")'
      FinancialEmailImport__Sources__5__Enabled: "true"
      FinancialEmailImport__Sources__5__CollectionMode: Attachments

      FinancialDocuments__StoragePath: /var/lib/saldo360/financial-documents
      ReverseProxy__KnownNetworks__0: 172.16.0.0/12
      ReverseProxy__AllowedHosts__0: ${SALDO360_PUBLIC_HOST:?Defina SALDO360_PUBLIC_HOST no .env}
    volumes:
      - /etc/saldo360/secrets/oidc-client-secret:/run/secrets/oidc-client-secret:ro
      - /etc/saldo360/secrets/service-account-identifier-hmac-key:/run/secrets/service-account-identifier-hmac-key:ro
      - /etc/saldo360/secrets/gmail:/etc/saldo360/secrets/gmail:ro
      - /etc/homeautomation/certs/caddy-local-root.crt:/usr/local/share/ca-certificates/caddy-local-root.crt:ro
      - /var/lib/saldo360/financial-documents:/var/lib/saldo360/financial-documents:rw
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: saldo360-web:${SALDO360_IMAGE_TAG:?Defina SALDO360_IMAGE_TAG com o SHA imutavel do release}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SALDO360_WEB_PORT:-5600}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

  migrate:
    image: saldo360-api:${SALDO360_IMAGE_TAG:?Defina SALDO360_IMAGE_TAG com o SHA imutavel do release}
    profiles: ["migration"]
    # Expand inside the container, not in Compose: preserve the complete connection
    # (including cutover Options) as one argument; never fall back to design-time settings.
    entrypoint: ["/bin/sh", "-eu", "-c", 'exec /app/efbundle --connection "$${ConnectionStrings__Saldo360:?Migration connection is required}" "$$@"', "efbundle"]
    group_add:
      - "1654"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Saldo360: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Options=-c saldo360.workspace_cutover_plan=${FINANCIAL_WORKSPACE_CUTOVER_PLAN:?Define the approved production workspace cutover plan before migration}"
      Authentication__Oidc__Authority: https://auth.home.doublesilva.com
      Authentication__Oidc__ClientId: saldo360
      Authentication__Oidc__ClientSecretFile: /run/secrets/oidc-client-secret
      ServiceAccounts__IdentifierHmacKeyFile: /run/secrets/service-account-identifier-hmac-key
      Authentication__Oidc__BackchannelCaCertificatePath: /usr/local/share/ca-certificates/caddy-local-root.crt
    volumes:
      - /etc/saldo360/secrets/oidc-client-secret:/run/secrets/oidc-client-secret:ro
      - /etc/saldo360/secrets/service-account-identifier-hmac-key:/run/secrets/service-account-identifier-hmac-key:ro
      - /etc/homeautomation/certs/caddy-local-root.crt:/usr/local/share/ca-certificates/caddy-local-root.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

volumes:
  saldo360-pgdata:

networks:
  backend: {}
