# Serviços de desenvolvimento local.
# Credenciais do PostgreSQL vêm do arquivo .env (não versionado): copie .env.example para .env.
# Authelia LOCAL é opcional (profile "authelia-local"); o provedor padrão é https://auth.home.doublesilva.com.
#   Ativar: pwsh scripts/setup-dev-auth.ps1  e  docker compose --profile authelia-local up -d --wait
#   Segredos dele vêm de dev/authelia/secrets (não versionado).
services:
  postgres:
    image: postgres:17-alpine
    container_name: saldo360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - saldo360-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Provedor OIDC local opcional: https://auth.saldo360.localhost:9091
  authelia:
    image: authelia/authelia:4.39
    container_name: saldo360-authelia
    profiles: [authelia-local]
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      X_AUTHELIA_CONFIG: /config/configuration.yml
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage_encryption_key
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /secrets/oidc_hmac_secret
    volumes:
      - ./dev/authelia/configuration.yml:/config/configuration.yml:ro
      - ./dev/authelia/secrets:/secrets:ro
      - ./dev/authelia/data:/data
    ports:
      - "127.0.0.1:9091:9091"

volumes:
  saldo360-pgdata:
