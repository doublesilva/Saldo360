name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmark_area:
        description: 'none = FULL; other choices benchmark declared dependencies and never authorize a release'
        type: choice
        default: none
        options: [none, goals, cards, security]
  schedule:
    - cron: '23 5 * * 1' # FULL weekly, UTC. Manual default is FULL; explicit benchmarks cannot authorize releases.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
      infra: ${{ steps.detect.outputs.infra }}
      full: ${{ steps.detect.outputs.full }}
      release_full: ${{ steps.detect.outputs.release_full }}
      affected_filter: ${{ steps.detect.outputs.affected_filter }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate change classifier
        run: bash scripts/ci/test-classify-changes.sh
      - name: Validate FULL release gate (synthetic, no remote calls)
        run: bash scripts/ci/test-release-gate.sh
      - name: Validate manual selection and release eligibility
        run: bash scripts/ci/test-workflow-selection.sh
      - name: Detect changed components
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BENCHMARK_AREA: ${{ inputs.benchmark_area || 'none' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed-files.txt"
          all=false
          manual_benchmark=false
          base=''
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$BENCHMARK_AREA" != none ]; then
            manual_benchmark=true
            base='declared-benchmark-path'
            case "$BENCHMARK_AREA" in
              goals) path=src/Saldo360.Application/Goals/FinancialGoalService.cs ;;
              cards) path=src/Saldo360.Domain/CreditCards/FinancialCreditCardPurchase.cs ;;
              security) path=src/Saldo360.Api/Authentication/AuthenticationSetup.cs ;;
              *) echo '::error::Unknown benchmark area'; exit 1 ;;
            esac
            printf '%s\n' "$path" > "$changed"
          elif [ "$EVENT_NAME" = workflow_dispatch ] || [ "$EVENT_NAME" = schedule ]; then
            all=true
            echo 'manual/scheduled FULL: validating every component'
          else
            if [ "$EVENT_NAME" = pull_request ]; then base="$PR_BASE_SHA"; else base="$PUSH_BEFORE_SHA"; fi
            if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              all=true
              echo "No usable base commit for $EVENT_NAME: validating every component"
            elif ! git diff --name-only --no-renames "$base" "$HEAD_SHA" > "$changed"; then
              all=true
              echo 'git diff failed: validating every component'
            fi
          fi
          if [ "$all" = true ]; then
            backend=true; frontend=true; infra=true; full=true; affected_filter=''
          else
            cat "$changed"
            eval "$(bash scripts/ci/classify-changes.sh < "$changed")"
          fi
          release_full=$full
          if [ "$manual_benchmark" = true ]; then
            # Include every non-backend stage in timing; declared paths cannot mint a release check.
            frontend=true; infra=true; release_full=false
          fi
          printf 'backend=%s\nfrontend=%s\ninfra=%s\nfull=%s\nrelease_full=%s\naffected_filter=%s\n' "$backend" "$frontend" "$infra" "$full" "$release_full" "$affected_filter" >> "$GITHUB_OUTPUT"
          {
            echo '### Incremental CI'; echo
            echo "- event: \`$EVENT_NAME\`"
            echo "- base: \`${base:-all}\`"
            echo "- head: \`$HEAD_SHA\`"; echo
            echo '| component | runs |'; echo '|---|---|'
            echo "| backend | $backend |"
            echo "| frontend | $frontend |"
            echo "| infra | $infra |"
            echo "| FULL | $full |"
            echo "| release-eligible FULL | $release_full |"
            echo "| declared benchmark | $manual_benchmark |"
            echo "| additional AFFECTED | ${affected_filter:+selected} |"
            if [ -s "$changed" ]; then
              echo; echo '<details><summary>Changed files</summary>'; echo
              sed 's/^/- `/' "$changed" | sed 's/$/`/'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify .NET 10 SDK on hosted runner
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          if ! dotnet --list-sdks | grep -Eq '^10\.[0-9]+\.[0-9]+ '; then
            echo '::error::The hosted runner does not include a .NET 10 SDK.'
            exit 1
          fi
      - name: Cache NuGet packages (never credentials or application output)
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-dotnet10-nuget-tci2-${{ hashFiles('**/*.csproj', 'Directory.*', 'global.json', 'dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-dotnet10-nuget-tci2-
      - name: Restore
        run: dotnet restore Saldo360.slnx
      - name: Build backend (Release)
        run: dotnet build Saldo360.slnx --configuration Release --no-restore
      - name: Test FAST (critical contracts and real PostgreSQL sentinels)
        if: needs.changes.outputs.full != 'true'
        run: dotnet test tests/Saldo360.Tests/Saldo360.Tests.csproj --configuration Release --no-build --no-restore --filter "Profile=FAST" --logger "trx;LogFileName=fast.trx" --results-directory TestResults -- RunConfiguration.TreatNoTestsAsError=true
      - name: Test FULL (all legitimate tests, PostgreSQL and migrations)
        if: needs.changes.outputs.full == 'true'
        run: dotnet test tests/Saldo360.Tests/Saldo360.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=full.trx" --results-directory TestResults -- RunConfiguration.TreatNoTestsAsError=true
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  backend-affected:
    name: backend-affected
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.full != 'true' && needs.changes.outputs.affected_filter != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify .NET 10 SDK on hosted runner
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          if ! dotnet --list-sdks | grep -Eq '^10\.[0-9]+\.[0-9]+ '; then
            echo '::error::The hosted runner does not include a .NET 10 SDK.'
            exit 1
          fi
      - name: Cache NuGet packages (never credentials or application output)
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-dotnet10-nuget-tci2-${{ hashFiles('**/*.csproj', 'Directory.*', 'global.json', 'dotnet-tools.json') }}
          restore-keys: ${{ runner.os }}-dotnet10-nuget-tci2-
      - name: Restore
        run: dotnet restore Saldo360.slnx
      - name: Build backend (Release)
        run: dotnet build Saldo360.slnx --configuration Release --no-restore
      - name: Test AFFECTED (non-FAST reverse dependencies)
        env:
          AFFECTED_FILTER: ${{ needs.changes.outputs.affected_filter }}
        run: dotnet test tests/Saldo360.Tests/Saldo360.Tests.csproj --configuration Release --no-build --no-restore --filter "$AFFECTED_FILTER" --logger "trx;LogFileName=affected.trx" --results-directory TestResults -- RunConfiguration.TreatNoTestsAsError=true
      - name: Preserve affected test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-affected-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  backend-image:
    name: backend-image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: saldo360-api:ci
      CONTAINER: saldo360-api-ci
      POSTGRES_CONTAINER: saldo360-postgres-ci
      NETWORK: saldo360-backend-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build API image (cached, local only)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          tags: ${{ env.IMAGE }}
          push: false
          load: true
          cache-from: type=gha,scope=saldo360-api-ci
          cache-to: type=gha,scope=saldo360-api-ci,mode=max
      - name: Smoke API image
        shell: bash
        run: |
          bash scripts/ci/smoke-api-image.sh

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: saldo360-web:ci
      CONTAINER: saldo360-web-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci
      - name: Build frontend
        working-directory: client
        run: npm run build
      - name: Test frontend
        working-directory: client
        run: npm test
      - name: Lint frontend
        working-directory: client
        run: npm run lint
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build web image (cached, local only)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          tags: ${{ env.IMAGE }}
          push: false
          load: true
          cache-from: type=gha,scope=saldo360-web-ci
          cache-to: type=gha,scope=saldo360-web-ci,mode=max
      - name: Smoke web image
        shell: bash
        run: |
          set -euo pipefail
          # O nginx resolve o upstream na inicialização. O host local apenas satisfaz o DNS;
          # o smoke acessa exclusivamente /web-health e não simula uma API.
          docker run -d --name "$CONTAINER" --add-host api:127.0.0.1 -p 127.0.0.1:18081:8080 "$IMAGE"
          for _ in $(seq 1 60); do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER")"
            [ "$health" = healthy ] && break
            [ "$(docker inspect --format '{{.State.Status}}' "$CONTAINER")" = running ] || exit 1
            sleep 1
          done
          [ "$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER")" = healthy ]
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:18081/web-health >/dev/null
          [ "$(docker exec "$CONTAINER" id -u)" != 0 ]
      - name: Web container diagnostics
        if: failure()
        run: |
          docker logs "$CONTAINER" || true
          docker inspect "$CONTAINER" || true
      - name: Remove web smoke container
        if: always()
        run: docker rm -f "$CONTAINER" 2>/dev/null || true

  infra:
    name: infra
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate production compose
        shell: bash
        env:
          # Synthetic cutover values for compose syntax validation only; never production fallbacks.
          FINANCIAL_WORKSPACE_ID: 11111111-1111-4111-8111-111111111111
          FINANCIAL_WORKSPACE_CUTOVER_PLAN: '[{"family_id":"22222222-2222-4222-8222-222222222222","workspace_id":"11111111-1111-4111-8111-111111111111","owner_user_id":"33333333-3333-4333-8333-333333333333"}]'
        run: |
          cp .env.production.example "$RUNNER_TEMP/saldo360.env"
          sed -i 's/troque-esta-senha-forte/ci-only-not-a-secret/' "$RUNNER_TEMP/saldo360.env"
          docker compose --env-file "$RUNNER_TEMP/saldo360.env" -f docker-compose.production.yml config --quiet
      - name: Validate clean install and optional collector configuration
        run: bash scripts/ci/test-clean-install-compose.sh
      - name: Validate disabled statement agent and secret preflight
        run: bash scripts/ci/test-statement-agent-deploy.sh
      - name: Test statement secret permissions in disposable container
        run: bash scripts/ci/test-statement-agent-secret-reader.sh
      - name: Validate Linux scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            head -n 1 "$script" | grep -Eq '^#!/usr/bin/env bash$|^#!/bin/bash$'
            if grep -q $'\r' "$script"; then echo "::error file=$script::CRLF is not allowed"; exit 1; fi
            bash -n "$script"
          done < <(find deploy scripts -type f -name '*.sh' -print0)
      - name: Test privileged deploy wrapper
        run: bash deploy/server/test-deploy-saldo360-wrapper.sh

  ci-full-success:
    name: ci-full-success
    needs: [changes, backend, backend-affected, backend-image, frontend, infra]
    if: always() && needs.changes.outputs.release_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: FULL and all relevant validations succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          [ "$(echo "$NEEDS" | jq -r '.changes.result')" = success ]
          [ "$(echo "$NEEDS" | jq -r '.backend.result')" = success ]
          failed="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')"
          [ -z "$failed" ] || { echo "::error::FULL validations failed: $failed"; exit 1; }

  ci-success:
    name: ci-success
    needs: [changes, backend, backend-affected, backend-image, frontend, infra]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every relevant job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          [ "$(echo "$NEEDS" | jq -r '.changes.result')" = success ]
          failed="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')"
          if [ -n "$failed" ]; then
            echo "::error::Jobs not successful: $failed"
            exit 1
          fi
