name: Deploy Saldo360

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  id-token: write

concurrency:
  group: saldo360-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: saldo360-production

    env:
      DEPLOY_HOST: ${{ vars.SALDO360_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.SALDO360_DEPLOY_USER }}
      EXPECTED_FINGERPRINT: ${{ vars.SALDO360_SSH_HOST_FINGERPRINT }}
      TAILSCALE_TAG: ${{ vars.SALDO360_TAILSCALE_TAG }}
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Validate ref and configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Produção só pode ser publicada a partir de main."
            exit 1
          fi
          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::DEPLOY_SHA não é um SHA Git completo e minúsculo."
            exit 1
          fi

          missing=0
          for pair in             SALDO360_DEPLOY_HOST:DEPLOY_HOST             SALDO360_DEPLOY_USER:DEPLOY_USER             SALDO360_SSH_HOST_FINGERPRINT:EXPECTED_FINGERPRINT             SALDO360_TAILSCALE_TAG:TAILSCALE_TAG; do
            env_name="${pair#*:}"
            if [ -z "${!env_name}" ]; then
              echo "::error::Repository variable ${pair%%:*} não configurada."
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify ci-success for deploy SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          response="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA/check-runs?per_page=100")"

          check="$(printf '%s' "$response" | jq -c '
            [
              .check_runs[]
              | select(.name == "ci-success")
              | select(.app.slug == "github-actions")
            ]
            | sort_by(.id)
            | last // empty
          ')"

          if [ -z "$check" ]; then
            echo "::error::Nenhum check ci-success encontrado para o SHA $DEPLOY_SHA."
            exit 1
          fi

          status="$(printf '%s' "$check" | jq -r '.status')"
          conclusion="$(printf '%s' "$check" | jq -r '.conclusion // ""')"
          details_url="$(printf '%s' "$check" | jq -r '.details_url // ""')"

          echo "ci-success: status=$status conclusion=${conclusion:-none}"
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "::error::O SHA $DEPLOY_SHA não possui ci-success concluído com sucesso."
            [ -n "$details_url" ] && echo "Check: $details_url"
            exit 1
          fi

          {
            echo "### Deploy gate"
            echo "- SHA: \`$DEPLOY_SHA\`"
            echo "- ci-success: **success**"
            [ -n "$details_url" ] && echo "- Check: $details_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout deploy SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: ${{ vars.SALDO360_TAILSCALE_TAG }}
          ping: ${{ vars.SALDO360_DEPLOY_HOST }}

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Secret DEPLOY_SSH_KEY vazio ou não disponível no environment."
            exit 1
          fi
          # Aceita finais de linha CRLF ao colar uma chave OpenSSH no GitHub.
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" | sed 's/\r$//' > ~/.ssh/id_ed25519)
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KEY inválida ou protegida por passphrase. Cadastre a chave privada OpenSSH completa (não o arquivo .pub), preservando as quebras de linha."
            exit 1
          fi

          scanned="$(mktemp)"
          ssh-keyscan -t ed25519 -T 10 "$DEPLOY_HOST" > "$scanned"
          test "$(grep -cv '^#' "$scanned")" = "1"

          actual="$(ssh-keygen -lf "$scanned" -E sha256 | awk '{print $2}')"
          # Remove apenas espaços de borda/CRLF; nunca aceita uma chave de host diferente.
          expected="$(printf '%s' "$EXPECTED_FINGERPRINT" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "Fingerprint recebido: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Fingerprint SSH divergente. Verifique SALDO360_SSH_HOST_FINGERPRINT e compare com ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub -E sha256 no servidor."
            exit 1
          fi

          grep -v '^#' "$scanned" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          rm -f "$scanned"

      - name: Verify server bootstrap
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo "SSH autenticado como: $(id -un)"
          failed=0
          for path in /srv/saldo360-deploy; do
            if test -d "$path"; then
              echo "OK diretório: $path"
            else
              echo "::error::Diretório ausente ou inacessível: $path"
              failed=1
            fi
          done
          # Segredo OIDC em diretório root:700: apenas o script sudo pode validá-lo.
          for path in /srv/saldo360-deploy/.env; do
            if test -f "$path"; then
              echo "OK arquivo existente: $path"
            else
              echo "::error::Arquivo ausente ou inacessível: $path"
              failed=1
            fi
          done
          if test -x /usr/local/sbin/deploy-saldo360; then
            echo "OK executável: /usr/local/sbin/deploy-saldo360"
          else
            echo "::error::Script ausente ou não executável: /usr/local/sbin/deploy-saldo360"
            failed=1
          fi
          if ! protocol="$(sudo -n /usr/local/sbin/deploy-saldo360 --protocol-version)"; then
            echo "::error::Bootstrap privilegiado incompleto: sudo não interativo para deploy-saldo360 não está disponível."
            failed=1
          elif test "$protocol" = "1"; then
            echo "OK protocolo privilegiado: $protocol"
          else
            echo "::error::Wrapper privilegiado incompatível (esperado protocolo 1, recebido: $protocol)."
            failed=1
          fi
          exit "$failed"
          REMOTE

      - name: Create release
        shell: bash
        env:
          DEPLOY_RELEASE_SIGNING_KEY: ${{ secrets.DEPLOY_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          if [ -z "$DEPLOY_RELEASE_SIGNING_KEY" ]; then
            echo "::error::Secret DEPLOY_RELEASE_SIGNING_KEY vazio ou não disponível no environment."
            exit 1
          fi

          signing_key="$RUNNER_TEMP/deploy-release-signing-key.pem"
          trap 'rm -f "$signing_key"' EXIT
          (umask 077 && printf '%s\n' "$DEPLOY_RELEASE_SIGNING_KEY" | sed 's/\r$//' > "$signing_key")
          if ! openssl pkey -in "$signing_key" -check -noout >/dev/null 2>&1; then
            echo "::error::DEPLOY_RELEASE_SIGNING_KEY não contém uma chave privada PEM válida."
            exit 1
          fi

          git archive --format=tar.gz --output=/tmp/saldo360-release.tar.gz HEAD
          release_hash="$(sha256sum /tmp/saldo360-release.tar.gz | awk '{print $1}')"
          script_hash="$(sha256sum deploy/server/deploy-saldo360 | awk '{print $1}')"
          printf 'protocol=1\ncommit=%s\nrelease_sha256=%s\nscript_sha256=%s\n' \
            "$DEPLOY_SHA" "$release_hash" "$script_hash" \
            > /tmp/saldo360-release-manifest.txt
          openssl dgst -sha256 -sign "$signing_key" \
            -out /tmp/saldo360-release-manifest.sig \
            /tmp/saldo360-release-manifest.txt
          rm -f "$signing_key"
          trap - EXIT

      - name: Upload release
        shell: bash
        run: |
          scp \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            /tmp/saldo360-release.tar.gz \
            /tmp/saldo360-release-manifest.txt \
            /tmp/saldo360-release-manifest.sig \
            "$DEPLOY_USER@$DEPLOY_HOST:/srv/saldo360-deploy/"

      - name: Prepare staging
        shell: bash
        run: |
          ssh             -i ~/.ssh/id_ed25519             -o BatchMode=yes             -o StrictHostKeyChecking=yes             "$DEPLOY_USER@$DEPLOY_HOST"             'bash -s' <<'REMOTE'
          set -euo pipefail
          test -f /srv/saldo360-deploy/saldo360-release.tar.gz
          test -f /srv/saldo360-deploy/saldo360-release-manifest.txt
          test -f /srv/saldo360-deploy/saldo360-release-manifest.sig
          REMOTE

      - name: Deploy
        shell: bash
        run: |
          ssh             -i ~/.ssh/id_ed25519             -o BatchMode=yes             -o StrictHostKeyChecking=yes             "$DEPLOY_USER@$DEPLOY_HOST"             "sudo -n /usr/local/sbin/deploy-saldo360 '$DEPLOY_SHA'"

      - name: Summary
        run: |
          {
            echo "### Saldo360 production"
            echo "- Commit: `$DEPLOY_SHA`"
            echo "- Host: `$DEPLOY_HOST`"
            echo "- Status: deploy concluído"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519 /tmp/saldo360-release.tar.gz /tmp/saldo360-release-manifest.txt /tmp/saldo360-release-manifest.sig
